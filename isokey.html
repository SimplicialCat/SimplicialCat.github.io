<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Isomorphic Keyboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #171a20;
      --text: #e9edf2;
      --muted: #8f98a8;
      --key-size: 42px;
      --key-gap: 7px;
      --row-step: calc((var(--key-size) + var(--key-gap)) * 0.866);
      --col-step: calc(var(--key-size) + var(--key-gap));
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 10px;
      flex-wrap: wrap;
      padding: 8px 12px;
      border-bottom: 1px solid #252a33;
      background: rgb(23 26 32 / 0.94);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0;
      font-size: 12px;
      font-weight: 560;
      letter-spacing: 0;
      line-height: 1;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 12px;
    }

    .settings-details {
      color: var(--muted);
      font-size: 13px;
    }

    .settings-details summary {
      width: max-content;
      border: 1px solid #303644;
      border-radius: 7px;
      background: #101319;
      color: var(--text);
      padding: 8px 10px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .settings-details[open] .controls {
      margin-top: 12px;
    }

    .setting {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 13px;
    }

    .setting {
      width: 100%;
      min-width: min(290px, 100%);
    }

    select {
      min-width: 150px;
      border: 1px solid #303644;
      border-radius: 7px;
      background: #101319;
      color: var(--text);
      padding: 8px 10px;
      font: inherit;
    }

    input[type="range"] {
      width: min(190px, 42vw);
      accent-color: #78dcca;
    }

    .setting-value {
      width: 46px;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .palette-panel {
      width: 100%;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      justify-items: start;
      gap: 10px 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .pitch-grid,
    .color-grid {
      display: grid;
      grid-template-columns: repeat(12, 24px);
      gap: 7px;
      align-items: center;
    }

    .pitch-swatch,
    .color-swatch {
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 50%;
      padding: 0;
      background: var(--swatch-color);
      box-shadow:
        inset 0 0 0 1px rgb(255 255 255 / 0.16),
        0 4px 10px rgb(0 0 0 / 0.22);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .pitch-swatch {
      position: relative;
    }

    .pitch-swatch.is-selected,
    .color-swatch.is-selected {
      outline: 2px solid #e9edf2;
      outline-offset: 3px;
    }

    .pitch-swatch::after {
      content: attr(data-label);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #0f1115;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 1px 4px rgb(255 255 255 / 0.35);
      pointer-events: none;
    }

    .reset-button {
      border: 1px solid #303644;
      border-radius: 7px;
      background: #101319;
      color: var(--text);
      padding: 8px 10px;
      font: inherit;
      cursor: pointer;
    }

    main {
      position: fixed;
      inset: 0;
      min-width: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      padding: 0;
      overscroll-behavior: contain;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    main::-webkit-scrollbar {
      display: none;
    }

    .keyboard-shell {
      width: 100%;
      min-width: 100%;
      min-height: 100%;
      height: 100%;
      display: grid;
    }

    .keyboard {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .key {
      position: absolute;
      width: var(--key-size);
      height: var(--key-size);
      display: block;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--key-color);
      box-shadow:
        inset 0 0 0 1px rgb(255 255 255 / 0.08),
        0 10px 22px rgb(0 0 0 / 0.22);
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
      -webkit-tap-highlight-color: transparent;
      transition: filter 120ms ease, opacity 120ms ease, box-shadow 120ms ease;
    }

    .key:hover,
    .key:focus-visible {
      filter: brightness(1.16) saturate(1.08);
      outline: none;
      box-shadow:
        inset 0 0 0 1px rgb(255 255 255 / 0.18),
        0 13px 28px rgb(0 0 0 / 0.28);
    }

    .key:active,
    .key.is-playing {
      filter: brightness(1.3) saturate(1.15);
    }

    .key.is-muted {
      opacity: 0.22;
      filter: grayscale(0.75) brightness(0.55);
      box-shadow:
        inset 0 0 0 1px rgb(255 255 255 / 0.05),
        0 10px 22px rgb(0 0 0 / 0.24);
    }

    .key.is-muted:hover,
    .key.is-muted:focus-visible {
      filter: grayscale(0.75) brightness(0.65);
    }

    @media (max-width: 720px) {
      :root {
        --key-gap: 6px;
      }

      header {
        align-items: flex-start;
        padding: 7px 10px;
      }

      .controls {
        width: 100%;
        justify-content: flex-start;
      }

      .settings-details {
        width: 100%;
      }

      .setting {
        width: 100%;
      }

      .palette-panel {
        grid-template-columns: 1fr;
      }

      .pitch-grid,
      .color-grid {
        grid-template-columns: repeat(6, 24px);
      }

      select,
      input[type="range"] {
        flex: 1;
      }

      main {
        padding: 0;
      }
    }

    @media (max-width: 420px) {
      header {
        gap: 8px;
      }

      .setting {
        gap: 7px;
      }

      .setting-value {
        width: 40px;
      }

      .pitch-grid,
      .color-grid {
        grid-template-columns: repeat(6, 22px);
        gap: 6px;
      }

      .pitch-swatch,
      .color-swatch {
        width: 22px;
        height: 22px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Isomorphic Keyboard</h1>
    <details class="settings-details">
      <summary>Settings</summary>
      <div class="controls" aria-label="Keyboard settings">
        <label class="setting">
          Mode
          <select id="modeSelect" aria-label="Keyboard mode"></select>
        </label>
        <label class="setting">
          Key size
          <input id="keySizeSlider" type="range" min="24" max="72" step="1" aria-label="Key size">
          <span id="keySizeValue" class="setting-value" aria-live="polite"></span>
        </label>
        <div class="palette-panel" aria-label="Palette editor">
          <span>Pitch color</span>
          <div id="pitchColorGrid" class="pitch-grid"></div>
          <button id="resetPalette" class="reset-button" type="button">Reset</button>
          <span>Choices</span>
          <div id="paletteChoiceGrid" class="color-grid"></div>
        </div>
      </div>
    </details>
  </header>

  <main id="viewport">
    <div class="keyboard-shell">
      <div id="keyboard" class="keyboard" aria-label="12EDO isomorphic keyboard"></div>
    </div>
  </main>

  <script>
    const baseKeyboardConfig = {
      edo: 12,
      hearingMinHz: 40,
      hearingMaxHz: 10000,
      anchor: {
        row: 0,
        column: 0,
        midi: 72
      }
    };

    const defaultPitchColors = [
      "#f4f7fb",
      "#4f8cff",
      "#f4f7fb",
      "#4f8cff",
      "#f4f7fb",
      "#f4f7fb",
      "#4f8cff",
      "#f4f7fb",
      "#4f8cff",
      "#f4f7fb",
      "#4f8cff",
      "#f4f7fb"
    ];

    const paletteChoices = [
      "#f4f7fb",
      "#ffe94f",
      "#ff3b30",
      "#007aff",
      "#34c759",
      "#ff9500",
      "#af52de",
      "#00c7be",
      "#ff2d8f",
      "#2c2f36"
    ];

    const pitchNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

    const keyboardModes = {
      classic: {
        name: "Classic Mode",
        rightStep: 2,
        uprightStep: 1
      },
      melodic: {
        name: "Melodic Mode",
        rightStep: 2,
        uprightStep: 7
      },
      harmonic: {
        name: "Harmonic Mode",
        rightStep: 4,
        uprightStep: 7
      }
    };

    let currentModeId = "classic";
    let selectedPitchClass = 0;
    const pitchColors = [...defaultPitchColors];
    let keyboardConfig = { ...baseKeyboardConfig, ...keyboardModes[currentModeId] };

    const modeSelect = document.querySelector("#modeSelect");
    const settingsDetails = document.querySelector(".settings-details");
    const keyboard = document.querySelector("#keyboard");
    const keySizeSlider = document.querySelector("#keySizeSlider");
    const keySizeValue = document.querySelector("#keySizeValue");
    const pitchColorGrid = document.querySelector("#pitchColorGrid");
    const paletteChoiceGrid = document.querySelector("#paletteChoiceGrid");
    const resetPalette = document.querySelector("#resetPalette");
    let audioContext;
    const activeVoices = new Map();
    const activePointers = new Map();

    function midiToFrequency(midi) {
      return 440 * 2 ** ((midi - 69) / 12);
    }

    function createModeOptions() {
      for (const [id, mode] of Object.entries(keyboardModes)) {
        const option = document.createElement("option");
        option.value = id;
        option.textContent = mode.name;
        modeSelect.append(option);
      }
    }

    function setMode(modeId) {
      currentModeId = modeId;
      keyboardConfig = { ...baseKeyboardConfig, ...keyboardModes[currentModeId] };
      modeSelect.value = currentModeId;
      requestAnimationFrame(renderKeyboard);
    }

    function renderPaletteEditor() {
      pitchColorGrid.replaceChildren();
      paletteChoiceGrid.replaceChildren();

      pitchColors.forEach((color, pitchClass) => {
        const swatch = document.createElement("button");
        swatch.className = "pitch-swatch";
        swatch.type = "button";
        swatch.style.setProperty("--swatch-color", color);
        swatch.dataset.label = pitchNames[pitchClass];
        swatch.setAttribute("aria-label", `${pitchNames[pitchClass]} color`);
        swatch.classList.toggle("is-selected", pitchClass === selectedPitchClass);
        swatch.addEventListener("click", () => {
          selectedPitchClass = pitchClass;
          renderPaletteEditor();
        });
        pitchColorGrid.append(swatch);
      });

      paletteChoices.forEach((color) => {
        const swatch = document.createElement("button");
        swatch.className = "color-swatch";
        swatch.type = "button";
        swatch.style.setProperty("--swatch-color", color);
        swatch.setAttribute("aria-label", `Assign ${color} to ${pitchNames[selectedPitchClass]}`);
        swatch.classList.toggle("is-selected", pitchColors[selectedPitchClass] === color);
        swatch.addEventListener("click", () => {
          pitchColors[selectedPitchClass] = color;
          renderPaletteEditor();
          renderKeyboard();
        });
        paletteChoiceGrid.append(swatch);
      });
    }

    function resetPitchColors() {
      pitchColors.splice(0, pitchColors.length, ...defaultPitchColors);
      selectedPitchClass = 0;
      renderPaletteEditor();
      renderKeyboard();
    }

    function defaultKeySize() {
      const availableWidth = Math.max(260, window.innerWidth - 32);
      const availableHeight = Math.max(260, window.innerHeight - 128);
      const fitted = Math.min(48, availableWidth / 13, availableHeight / 9);

      return Math.round(Math.min(72, Math.max(24, fitted)));
    }

    function setKeySize(size) {
      const roundedSize = Math.round(Number(size));

      document.documentElement.style.setProperty("--key-size", `${roundedSize}px`);
      keySizeSlider.value = String(roundedSize);
      keySizeValue.textContent = `${roundedSize}px`;
    }

    function initializeKeySize() {
      setKeySize(defaultKeySize());
    }

    function noteAt(row, column) {
      const anchor = keyboardConfig.anchor;
      const rowDelta = row - anchor.row;
      const doubledX = column * 2 + rowParity(row);
      const anchorDoubledX = anchor.column * 2 + rowParity(anchor.row);
      const rightDelta = (doubledX - anchorDoubledX + rowDelta) / 2;
      const uprightDelta = -rowDelta;

      return anchor.midi
        + rightDelta * keyboardConfig.rightStep
        + uprightDelta * keyboardConfig.uprightStep;
    }

    function rowParity(row) {
      return ((row % 2) + 2) % 2;
    }

    function keyPosition(row, column) {
      const keySize = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--key-size"));
      const keyGap = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--key-gap"));
      const colStep = keySize + keyGap;
      const rowStep = colStep * 0.866;
      const centerX = keyboard.clientWidth / 2;
      const centerY = keyboard.clientHeight / 2;
      const anchor = keyboardConfig.anchor;
      const x = centerX
        + ((column - anchor.column) + (rowParity(row) - rowParity(anchor.row)) * 0.5) * colStep
        - keySize / 2;
      const y = centerY + (row - anchor.row) * rowStep - keySize / 2;

      return { x, y, keySize, colStep, rowStep };
    }

    function visibleGridBounds() {
      const keySize = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--key-size"));
      const keyGap = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--key-gap"));
      const colStep = keySize + keyGap;
      const rowStep = colStep * 0.866;
      const anchor = keyboardConfig.anchor;
      const rowReach = Math.ceil(keyboard.clientHeight / rowStep / 2) + 2;
      const columnReach = Math.ceil(keyboard.clientWidth / colStep / 2) + 3;

      return {
        rowMin: anchor.row - rowReach,
        rowMax: anchor.row + rowReach,
        columnMin: anchor.column - columnReach,
        columnMax: anchor.column + columnReach
      };
    }

    function stopVoice(pointerId) {
      const voice = activeVoices.get(pointerId);
      if (!voice || !audioContext) return;

      const now = audioContext.currentTime;
      voice.gain.gain.cancelScheduledValues(now);
      voice.gain.gain.setValueAtTime(Math.max(voice.gain.gain.value, 0.0001), now);
      voice.gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);
      voice.oscillator.stop(now + 0.95);
      voice.key.classList.remove("is-playing");
      activeVoices.delete(pointerId);
    }

    function startTone(midi, key, pointerId) {
      audioContext ??= new AudioContext();
      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
      stopVoice(pointerId);

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const now = audioContext.currentTime;

      oscillator.type = "sine";
      oscillator.frequency.value = midiToFrequency(midi);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.2, now + 0.025);
      gain.gain.setTargetAtTime(0.16, now + 0.025, 0.18);

      oscillator.connect(gain).connect(audioContext.destination);
      oscillator.start(now);

      key.classList.add("is-playing");
      activeVoices.set(pointerId, { oscillator, gain, key });
    }

    function keyFromPoint(clientX, clientY) {
      let nearestKey = null;
      let nearestDistance = Infinity;
      const maxDistance = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--key-size")) * 0.62;

      for (const key of keyboard.querySelectorAll(".key[data-audible='true']")) {
        const rect = key.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const distance = Math.hypot(clientX - centerX, clientY - centerY);

        if (distance < nearestDistance) {
          nearestDistance = distance;
          nearestKey = key;
        }
      }

      return nearestDistance <= maxDistance ? nearestKey : null;
    }

    function movePointerToKey(event) {
      const key = keyFromPoint(event.clientX, event.clientY);
      const lastKey = activePointers.get(event.pointerId);

      if (key === lastKey) return;

      stopVoice(event.pointerId);
      activePointers.set(event.pointerId, key);

      if (key) {
        startTone(Number(key.dataset.midi), key, event.pointerId);
      }
    }

    function releasePointer(event) {
      stopVoice(event.pointerId);
      activePointers.delete(event.pointerId);
    }

    function renderKeyboard() {
      keyboard.replaceChildren();
      keyboard.setAttribute("aria-label", `${keyboardConfig.name} isomorphic keyboard`);

      const bounds = visibleGridBounds();

      for (let row = bounds.rowMin; row <= bounds.rowMax; row += 1) {
        for (let column = bounds.columnMin; column <= bounds.columnMax; column += 1) {
          const { x, y, keySize } = keyPosition(row, column);

          if (
            x > keyboard.clientWidth ||
            y > keyboard.clientHeight ||
            x + keySize < 0 ||
            y + keySize < 0
          ) {
            continue;
          }

          const midi = noteAt(row, column);
          const frequency = midiToFrequency(midi);
          const isAudible = frequency >= keyboardConfig.hearingMinHz && frequency <= keyboardConfig.hearingMaxHz;
          const pitchClass = ((midi % keyboardConfig.edo) + keyboardConfig.edo) % keyboardConfig.edo;
          const key = document.createElement("div");

          key.className = "key";
          key.classList.toggle("is-muted", !isAudible);
          key.setAttribute("role", "button");
          key.tabIndex = 0;
          key.style.setProperty("--key-color", pitchColors[pitchClass]);
          key.style.transform = `translate(${x}px, ${y}px)`;
          key.setAttribute("aria-label", `Pitch class ${pitchClass}`);
          key.dataset.midi = String(midi);
          key.dataset.audible = String(isAudible);
          key.dataset.pitchClass = String(pitchClass);
          key.dataset.row = String(row);
          key.dataset.column = String(column);

          keyboard.append(key);
        }
      }
    }

    createModeOptions();
    renderPaletteEditor();
    initializeKeySize();
    renderKeyboard();
    modeSelect.addEventListener("change", () => setMode(modeSelect.value));
    resetPalette.addEventListener("click", resetPitchColors);
    keySizeSlider.addEventListener("input", () => {
      setKeySize(keySizeSlider.value);
      requestAnimationFrame(renderKeyboard);
    });
    window.addEventListener("resize", renderKeyboard);
    settingsDetails.addEventListener("toggle", () => requestAnimationFrame(renderKeyboard));
    keyboard.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      keyboard.setPointerCapture(event.pointerId);
      movePointerToKey(event);
    });
    keyboard.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });
    keyboard.addEventListener("pointermove", (event) => {
      if (!activePointers.has(event.pointerId)) return;

      event.preventDefault();
      movePointerToKey(event);
    });
    keyboard.addEventListener("pointerup", releasePointer);
    keyboard.addEventListener("pointercancel", releasePointer);
    keyboard.addEventListener("lostpointercapture", releasePointer);
    requestAnimationFrame(renderKeyboard);
  </script>
</body>
</html>
