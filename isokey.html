<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Isomorphic Keyboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #171a20;
      --text: #e9edf2;
      --muted: #8f98a8;
      --key-size: 42px;
      --key-gap: 7px;
      --row-step: calc((var(--key-size) + var(--key-gap)) * 0.866);
      --col-step: calc(var(--key-size) + var(--key-gap));
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 10px;
      flex-wrap: wrap;
      padding: 8px 12px;
      border-bottom: 1px solid #252a33;
      background: rgb(23 26 32 / 0.94);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0;
      font-size: 12px;
      font-weight: 560;
      letter-spacing: 0;
      line-height: 1;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 12px;
    }

    .settings-details {
      color: var(--muted);
      font-size: 13px;
    }

    .settings-details summary {
      width: max-content;
      border: 1px solid #303644;
      border-radius: 7px;
      background: #101319;
      color: var(--text);
      padding: 8px 10px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .settings-details[open] .controls {
      margin-top: 12px;
    }

    .setting {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 13px;
    }

    .setting {
      width: 100%;
      min-width: min(290px, 100%);
    }

    .setting.is-disabled {
      opacity: 0.48;
    }

    .microtonal-settings {
      display: none;
      width: 100%;
      gap: 9px;
      flex-direction: column;
    }

    .microtonal-settings.is-visible {
      display: flex;
    }

    .microtonal-settings input[type="number"] {
      width: min(150px, 42vw);
      border: 1px solid #303644;
      border-radius: 7px;
      background: #101319;
      color: var(--text);
      padding: 8px 10px;
      font: inherit;
    }

    .microtonal-status {
      color: var(--muted);
      font-size: 12px;
    }

    .key.microtonal-numbered::after {
      content: attr(data-microtonal-number);
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 17px;
      font-weight: 760;
      color: #ffffff;
      text-shadow: 0 2px 5px rgb(0 0 0 / 0.9), 0 0 8px rgb(0 0 0 / 0.72);
      transform: rotate(var(--keyboard-counter-rotation, 0deg));
      pointer-events: none;
    }

    select {
      min-width: 150px;
      border: 1px solid #303644;
      border-radius: 7px;
      background: #101319;
      color: var(--text);
      padding: 8px 10px;
      font: inherit;
    }

    input[type="range"] {
      width: min(190px, 42vw);
      accent-color: #78dcca;
    }

    .setting-value {
      width: 46px;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .palette-panel {
      width: 100%;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      justify-items: start;
      gap: 10px 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .pitch-grid,
    .color-grid {
      display: grid;
      grid-template-columns: repeat(12, 24px);
      gap: 7px;
      align-items: center;
    }

    .pitch-swatch,
    .color-swatch {
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 50%;
      padding: 0;
      background: var(--swatch-color);
      box-shadow:
        inset 0 0 0 1px rgb(255 255 255 / 0.16),
        0 4px 10px rgb(0 0 0 / 0.22);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .pitch-swatch {
      position: relative;
    }

    .pitch-swatch.is-selected,
    .color-swatch.is-selected {
      outline: 2px solid #e9edf2;
      outline-offset: 3px;
    }

    .pitch-swatch::after {
      content: attr(data-label);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #0f1115;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 1px 4px rgb(255 255 255 / 0.35);
      pointer-events: none;
    }

    .reset-button {
      border: 1px solid #303644;
      border-radius: 7px;
      background: #101319;
      color: var(--text);
      padding: 8px 10px;
      font: inherit;
      cursor: pointer;
    }

    main {
      position: fixed;
      inset: 0;
      min-width: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      padding: 0;
      overscroll-behavior: contain;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    main::-webkit-scrollbar {
      display: none;
    }

    .keyboard-shell {
      width: 100%;
      min-width: 100%;
      min-height: 100%;
      height: 100%;
      display: grid;
    }

    .keyboard {
      position: relative;
      width: var(--keyboard-layer-size, 142vmax);
      height: var(--keyboard-layer-size, 142vmax);
      left: 50%;
      top: 50%;
      overflow: visible;
      transform: translate(-50%, -50%) rotate(var(--keyboard-rotation, 0deg));
      transform-origin: center;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .key {
      position: absolute;
      width: var(--key-size);
      height: var(--key-size);
      display: block;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--key-color);
      box-shadow:
        inset 0 0 0 1px rgb(255 255 255 / 0.08),
        0 10px 22px rgb(0 0 0 / 0.22);
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
      -webkit-tap-highlight-color: transparent;
      transition: filter 120ms ease, opacity 120ms ease, box-shadow 120ms ease;
    }

    .key:hover,
    .key:focus-visible {
      filter: brightness(1.16) saturate(1.08);
      outline: none;
      box-shadow:
        inset 0 0 0 1px rgb(255 255 255 / 0.18),
        0 13px 28px rgb(0 0 0 / 0.28);
    }

    .key:active,
    .key.is-playing {
      filter: brightness(1.55) saturate(1.35);
      box-shadow:
        inset 0 0 0 2px rgb(255 255 255 / 0.42),
        0 0 16px var(--key-glow-color),
        0 0 38px var(--key-glow-color),
        0 0 72px var(--key-glow-color),
        0 16px 32px rgb(0 0 0 / 0.34);
    }

    .key.is-muted {
      opacity: 0.22;
      filter: grayscale(0.75) brightness(0.55);
      box-shadow:
        inset 0 0 0 1px rgb(255 255 255 / 0.05),
        0 10px 22px rgb(0 0 0 / 0.24);
    }

    .key.is-muted:hover,
    .key.is-muted:focus-visible {
      filter: grayscale(0.75) brightness(0.65);
    }

    .chord-display {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      opacity: 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      transition: opacity 120ms ease;
    }

    .chord-display.is-visible {
      opacity: var(--chord-display-opacity, 0.58);
    }

    .chord-display.is-visible.is-unrecognized {
      opacity: calc(var(--chord-display-opacity, 0.58) * 0.55);
    }

    .chord-display-inner {
      text-align: center;
      color: #f4f7fb;
      text-shadow:
        0 0 10px rgb(0 0 0 / 0.85),
        0 0 26px rgb(0 0 0 / 0.7);
    }

    .chord-brief {
      font-size: clamp(30px, calc(12vw * var(--chord-brief-scale, 1)), 132px);
      font-weight: 760;
      line-height: 1;
      max-width: 94vw;
      white-space: pre-line;
    }

    .chord-full {
      margin-top: 8px;
      font-size: clamp(10px, calc(2.4vw * var(--chord-full-scale, 1)), 24px);
      font-weight: 540;
      max-width: 94vw;
      line-height: 1.28;
      white-space: pre-line;
    }

    @media (max-width: 720px) {
      :root {
        --key-gap: 6px;
      }

      header {
        align-items: flex-start;
        padding: 7px 10px;
      }

      .controls {
        width: 100%;
        justify-content: flex-start;
      }

      .settings-details {
        width: 100%;
      }

      .setting {
        width: 100%;
      }

      .palette-panel {
        grid-template-columns: 1fr;
      }

      .pitch-grid,
      .color-grid {
        grid-template-columns: repeat(6, 24px);
      }

      select,
      input[type="range"] {
        flex: 1;
      }

      main {
        padding: 0;
      }
    }

    @media (max-width: 420px) {
      header {
        gap: 8px;
      }

      .setting {
        gap: 7px;
      }

      .setting-value {
        width: 40px;
      }

      .pitch-grid,
      .color-grid {
        grid-template-columns: repeat(6, 22px);
        gap: 6px;
      }

      .pitch-swatch,
      .color-swatch {
        width: 22px;
        height: 22px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Isomorphic Keyboard</h1>
    <details class="settings-details">
      <summary>Settings</summary>
      <div class="controls" aria-label="Keyboard settings">
        <label class="setting">
          Mode
          <select id="modeSelect" aria-label="Keyboard mode"></select>
        </label>
        <div id="microtonalSettings" class="microtonal-settings" aria-label="Microtonal parameters">
          <label class="setting">
            Right numerator
            <input id="microRightNumerator" type="number" step="1" value="5" aria-label="Microtonal right numerator">
          </label>
          <label class="setting">
            Upright numerator
            <input id="microUprightNumerator" type="number" step="1" value="9" aria-label="Microtonal upright numerator">
          </label>
          <label class="setting">
            Common denominator
            <input id="microDenominator" type="number" min="1" step="1" value="53" aria-label="Microtonal common denominator">
          </label>
          <span id="microtonalStatus" class="microtonal-status" role="status" aria-live="polite"></span>
          <label class="setting">
            Show step numbers
            <input id="microtonalNumbersToggle" type="checkbox" aria-label="Show microtonal step numbers" checked>
          </label>
        </div>
        <label class="setting chord-setting">
          Chord mode
          <input id="chordModeToggle" type="checkbox" aria-label="Chord mode">
        </label>
        <label class="setting chord-opacity-setting">
          Chord text
          <input id="chordOpacitySlider" type="range" min="20" max="90" step="1" aria-label="Chord text opacity">
          <span id="chordOpacityValue" class="setting-value" aria-live="polite"></span>
        </label>
        <label class="setting">
          Key size
          <input id="keySizeSlider" type="range" min="24" max="72" step="1" aria-label="Key size">
          <span id="keySizeValue" class="setting-value" aria-live="polite"></span>
        </label>
        <label class="setting">
          Keyboard rotation
          <input id="rotationSlider" type="range" min="-180" max="180" step="1" value="0" aria-label="Keyboard rotation">
          <span id="rotationValue" class="setting-value" aria-live="polite"></span>
        </label>
        <div class="palette-panel" aria-label="Palette editor">
          <span>Pitch color</span>
          <div id="pitchColorGrid" class="pitch-grid"></div>
          <button id="resetPalette" class="reset-button" type="button">Reset</button>
          <span>Choices</span>
          <div id="paletteChoiceGrid" class="color-grid"></div>
        </div>
      </div>
    </details>
  </header>

  <main id="viewport">
    <div class="keyboard-shell">
      <div id="keyboard" class="keyboard" aria-label="12EDO isomorphic keyboard"></div>
    </div>
  </main>

  <div id="chordDisplay" class="chord-display" aria-hidden="true">
    <div class="chord-display-inner">
      <div id="chordBrief" class="chord-brief"></div>
      <div id="chordFull" class="chord-full"></div>
    </div>
  </div>

  <script>
    const baseKeyboardConfig = {
      edo: 12,
      hearingMinHz: 40,
      hearingMaxHz: 10000,
      gaussianCenterMidi: 60,
      gaussianSigmaOctaves: 1.35,
      anchor: {
        row: 0,
        column: 0,
        midi: 72
      }
    };

    const defaultPitchColors = [
      "#f4f7fb",
      "#4f8cff",
      "#f4f7fb",
      "#4f8cff",
      "#f4f7fb",
      "#f4f7fb",
      "#4f8cff",
      "#f4f7fb",
      "#4f8cff",
      "#f4f7fb",
      "#4f8cff",
      "#f4f7fb"
    ];

    const paletteChoices = [
      "#f4f7fb",
      "#ffe94f",
      "#ff3b30",
      "#007aff",
      "#34c759",
      "#ff9500",
      "#af52de",
      "#00c7be",
      "#ff2d8f",
      "#2c2f36"
    ];

    const pitchNames = ["C", "C#/Db", "D", "D#/Eb", "E", "F", "F#/Gb", "G", "G#/Ab", "A", "A#/Bb", "B"];
    const pitchSwatchLabels = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const pitchFullNames = [
      "C",
      "C sharp / D flat",
      "D",
      "D sharp / E flat",
      "E",
      "F",
      "F sharp / G flat",
      "G",
      "G sharp / A flat",
      "A",
      "A sharp / B flat",
      "B"
    ];
    const chordPatterns = [
      { intervals: [0, 4, 7, 10], suffix: "7", full: "dominant seventh chord" },
      { intervals: [0, 4, 7, 11], suffix: "maj7", full: "major seventh chord" },
      { intervals: [0, 3, 7, 10], suffix: "m7", full: "minor seventh chord" },
      { intervals: [0, 3, 6, 10], suffix: "m7b5", full: "half-diminished seventh chord" },
      { intervals: [0, 3, 6, 9], suffix: "dim7", full: "diminished seventh chord" },
      { intervals: [0, 4, 7, 9], suffix: "6", full: "sixth chord" },
      { intervals: [0, 3, 7, 9], suffix: "m6", full: "minor sixth chord" },
      { intervals: [0, 4, 7], suffix: "", full: "major chord" },
      { intervals: [0, 3, 7], suffix: "m", full: "minor chord" },
      { intervals: [0, 3, 6], suffix: "dim", full: "diminished chord" },
      { intervals: [0, 4, 8], suffix: "aug", full: "augmented chord" },
      { intervals: [0, 5, 7], suffix: "sus4", full: "suspended fourth chord" },
      { intervals: [0, 2, 7], suffix: "sus2", full: "suspended second chord" },
      { intervals: [0, 4], suffix: "", full: "major third" },
      { intervals: [0, 3], suffix: "m", full: "minor third" },
      { intervals: [0, 7], suffix: "5", full: "perfect fifth" },
      { intervals: [0, 6], suffix: "tritone", full: "tritone" }
    ];

    const keyboardModes = {
      classic: {
        name: "Classic Mode",
        rightStep: 2,
        uprightStep: 1
      },
      harmonic: {
        name: "Harmonic Mode",
        rightStep: 4,
        uprightStep: 7
      },
      microtonal: {
        name: "Microtonal Mode",
        rightStep: 5 / 53,
        uprightStep: 9 / 53,
        microtonal: true
      }
    };

    let currentModeId = "classic";
    let selectedPitchClass = 0;
    let chordModeEnabled = false;
    let chordDisplayOpacity = 0.58;
    let microtonalNumbersEnabled = true;
    const pitchColors = [...defaultPitchColors];
    let keyboardConfig = { ...baseKeyboardConfig, ...keyboardModes[currentModeId] };

    const modeSelect = document.querySelector("#modeSelect");
    const chordModeToggle = document.querySelector("#chordModeToggle");
    const chordModeSetting = document.querySelector(".chord-setting");
    const chordOpacitySlider = document.querySelector("#chordOpacitySlider");
    const chordOpacityValue = document.querySelector("#chordOpacityValue");
    const chordOpacitySetting = document.querySelector(".chord-opacity-setting");
    const microtonalSettings = document.querySelector("#microtonalSettings");
    const microRightNumerator = document.querySelector("#microRightNumerator");
    const microUprightNumerator = document.querySelector("#microUprightNumerator");
    const microDenominator = document.querySelector("#microDenominator");
    const microtonalStatus = document.querySelector("#microtonalStatus");
    const microtonalNumbersToggle = document.querySelector("#microtonalNumbersToggle");
    const settingsDetails = document.querySelector(".settings-details");
    const keyboard = document.querySelector("#keyboard");
    const keySizeSlider = document.querySelector("#keySizeSlider");
    const keySizeValue = document.querySelector("#keySizeValue");
    const rotationSlider = document.querySelector("#rotationSlider");
    const rotationValue = document.querySelector("#rotationValue");
    const pitchColorGrid = document.querySelector("#pitchColorGrid");
    const paletteChoiceGrid = document.querySelector("#paletteChoiceGrid");
    const resetPalette = document.querySelector("#resetPalette");
    const chordDisplay = document.querySelector("#chordDisplay");
    const chordBrief = document.querySelector("#chordBrief");
    const chordFull = document.querySelector("#chordFull");
    let audioContext;
    const activeVoices = new Map();
    const activePointers = new Map();
    const activePointerKeys = new Map();

    function midiToFrequency(midi) {
      return 440 * 2 ** ((midi - 69) / 12);
    }

    function updateMicrotonalSteps() {
      if (!keyboardConfig.microtonal) return;
      const rightNumerator = Number(microRightNumerator.value);
      const uprightNumerator = Number(microUprightNumerator.value);
      const denominator = Number(microDenominator.value);
      if (![rightNumerator, uprightNumerator, denominator].every(Number.isInteger) || denominator <= 0) {
        microtonalStatus.textContent = "Numerators and denominator must be integers; denominator must be positive.";
        return false;
      }
      keyboardConfig.rightStep = rightNumerator / denominator;
      keyboardConfig.uprightStep = uprightNumerator / denominator;
      keyboardConfig.microtonalDenominator = denominator;
      keyboardConfig.microtonalRightNumerator = rightNumerator;
      keyboardConfig.microtonalUprightNumerator = uprightNumerator;
      microtonalStatus.textContent = `Steps: ${rightNumerator}/${denominator} and ${uprightNumerator}/${denominator} octaves`;
      return true;
    }

    function gaussianWeight(midi) {
      const distanceInOctaves = (midi - keyboardConfig.gaussianCenterMidi) / keyboardConfig.edo;
      const sigma = keyboardConfig.gaussianSigmaOctaves;

      return Math.exp(-0.5 * (distanceInOctaves / sigma) ** 2);
    }

    function audibleOctaveMidisForPitchClass(pitchClass) {
      const midis = [];
      const minMidi = Math.ceil(69 + 12 * Math.log2(keyboardConfig.hearingMinHz / 440));
      const maxMidi = Math.floor(69 + 12 * Math.log2(keyboardConfig.hearingMaxHz / 440));

      for (let midi = minMidi; midi <= maxMidi; midi += 1) {
        if (pitchClassOfMidi(midi) === pitchClass) {
          midis.push(midi);
        }
      }

      return midis;
    }

    function brightenHexColor(hex, amount = 0.42) {
      const value = hex.replace("#", "");
      const red = Number.parseInt(value.slice(0, 2), 16);
      const green = Number.parseInt(value.slice(2, 4), 16);
      const blue = Number.parseInt(value.slice(4, 6), 16);
      const blend = (channel) => Math.round(channel + (255 - channel) * amount);

      return `rgb(${blend(red)} ${blend(green)} ${blend(blue)})`;
    }

    function createModeOptions() {
      for (const [id, mode] of Object.entries(keyboardModes)) {
        const option = document.createElement("option");
        option.value = id;
        option.textContent = mode.name;
        modeSelect.append(option);
      }
    }

    function setMode(modeId) {
      stopAllVoices();
      currentModeId = modeId;
      keyboardConfig = { ...baseKeyboardConfig, ...keyboardModes[currentModeId] };
      modeSelect.value = currentModeId;
      microtonalSettings.classList.toggle("is-visible", keyboardConfig.microtonal === true);
      updateMicrotonalSteps();
      syncChordModeAvailability();
      requestAnimationFrame(renderKeyboard);
    }

    function syncChordModeAvailability() {
      const canUseChordMode = currentModeId === "harmonic";

      if (!canUseChordMode) {
        chordModeEnabled = false;
        chordModeToggle.checked = false;
      }

      chordModeToggle.disabled = !canUseChordMode;
      chordOpacitySlider.disabled = !canUseChordMode || !chordModeEnabled;
      chordModeSetting.classList.toggle("is-disabled", !canUseChordMode);
      chordOpacitySetting.classList.toggle("is-disabled", !canUseChordMode || !chordModeEnabled);
    }

    function setChordDisplayOpacity(percent) {
      const normalized = Math.min(0.9, Math.max(0.2, Number(percent) / 100));

      chordDisplayOpacity = normalized;
      document.documentElement.style.setProperty("--chord-display-opacity", String(chordDisplayOpacity));
      chordOpacitySlider.value = String(Math.round(chordDisplayOpacity * 100));
      chordOpacityValue.textContent = `${Math.round(chordDisplayOpacity * 100)}%`;
    }

    function renderPaletteEditor() {
      pitchColorGrid.replaceChildren();
      paletteChoiceGrid.replaceChildren();

      pitchColors.forEach((color, pitchClass) => {
        const swatch = document.createElement("button");
        swatch.className = "pitch-swatch";
        swatch.type = "button";
        swatch.style.setProperty("--swatch-color", color);
        swatch.dataset.label = pitchSwatchLabels[pitchClass];
        swatch.setAttribute("aria-label", `${pitchNames[pitchClass]} color`);
        swatch.classList.toggle("is-selected", pitchClass === selectedPitchClass);
        swatch.addEventListener("click", () => {
          selectedPitchClass = pitchClass;
          renderPaletteEditor();
        });
        pitchColorGrid.append(swatch);
      });

      paletteChoices.forEach((color) => {
        const swatch = document.createElement("button");
        swatch.className = "color-swatch";
        swatch.type = "button";
        swatch.style.setProperty("--swatch-color", color);
        swatch.setAttribute("aria-label", `Assign ${color} to ${pitchNames[selectedPitchClass]}`);
        swatch.classList.toggle("is-selected", pitchColors[selectedPitchClass] === color);
        swatch.addEventListener("click", () => {
          pitchColors[selectedPitchClass] = color;
          renderPaletteEditor();
          renderKeyboard();
        });
        paletteChoiceGrid.append(swatch);
      });
    }

    function resetPitchColors() {
      pitchColors.splice(0, pitchColors.length, ...defaultPitchColors);
      selectedPitchClass = 0;
      renderPaletteEditor();
      renderKeyboard();
    }

    function defaultKeySize() {
      const availableWidth = Math.max(260, window.innerWidth - 32);
      const availableHeight = Math.max(260, window.innerHeight - 128);
      const fitted = Math.min(48, availableWidth / 13, availableHeight / 9);

      return Math.round(Math.min(72, Math.max(24, fitted)));
    }

    function setKeySize(size) {
      const roundedSize = Math.round(Number(size));

      document.documentElement.style.setProperty("--key-size", `${roundedSize}px`);
      keySizeSlider.value = String(roundedSize);
      keySizeValue.textContent = `${roundedSize}px`;
    }

    function setRotation(degrees) {
      const normalized = Math.min(180, Math.max(-180, Math.round(Number(degrees))));
      document.documentElement.style.setProperty("--keyboard-rotation", `${normalized}deg`);
      document.documentElement.style.setProperty("--keyboard-counter-rotation", `${-normalized}deg`);
      rotationSlider.value = String(normalized);
      rotationValue.textContent = `${normalized}°`;
    }

    function updateUrlState() {
      const params = new URLSearchParams();
      params.set("mode", currentModeId);
      params.set("chord", chordModeEnabled ? "1" : "0");
      params.set("chordOpacity", String(Math.round(chordDisplayOpacity * 100)));
      params.set("keySize", keySizeSlider.value);
      params.set("rotation", rotationSlider.value);
      params.set("numbers", microtonalNumbersEnabled ? "1" : "0");
      params.set("right", microRightNumerator.value);
      params.set("upright", microUprightNumerator.value);
      params.set("denominator", microDenominator.value);
      params.set("palette", pitchColors.join(","));
      history.replaceState(null, "", `${location.pathname}?${params}`);
    }

    function loadUrlState() {
      const params = new URLSearchParams(location.search);
      if (keyboardModes[params.get("mode")]) setMode(params.get("mode"));
      if (params.has("right")) microRightNumerator.value = params.get("right");
      if (params.has("upright")) microUprightNumerator.value = params.get("upright");
      if (params.has("denominator")) microDenominator.value = params.get("denominator");
      if (params.has("palette")) {
        const colors = params.get("palette").split(",");
        if (colors.length === pitchColors.length && colors.every((color) => /^#[0-9a-f]{6}$/i.test(color))) {
          pitchColors.splice(0, pitchColors.length, ...colors);
          renderPaletteEditor();
        }
      }
      updateMicrotonalSteps();
      if (params.has("numbers")) {
        microtonalNumbersEnabled = params.get("numbers") !== "0";
        microtonalNumbersToggle.checked = microtonalNumbersEnabled;
      }
      if (params.has("chordOpacity")) setChordDisplayOpacity(params.get("chordOpacity"));
      if (params.has("keySize")) setKeySize(params.get("keySize"));
      setRotation(params.get("rotation") ?? 0);
      chordModeEnabled = currentModeId === "harmonic" && params.get("chord") === "1";
      chordModeToggle.checked = chordModeEnabled;
      syncChordModeAvailability();
    }

    function initializeKeySize() {
      setKeySize(defaultKeySize());
    }

    function noteAt(row, column) {
      const anchor = keyboardConfig.anchor;
      const rowDelta = row - anchor.row;
      const doubledX = column * 2 + rowParity(row);
      const anchorDoubledX = anchor.column * 2 + rowParity(anchor.row);
      const rightDelta = (doubledX - anchorDoubledX + rowDelta) / 2;
      const uprightDelta = -rowDelta;

      const octaveScale = keyboardConfig.microtonal ? 12 : 1;
      return anchor.midi
        + rightDelta * keyboardConfig.rightStep * octaveScale
        + uprightDelta * keyboardConfig.uprightStep * octaveScale;
    }

    function rowParity(row) {
      return ((row % 2) + 2) % 2;
    }

    function keyPosition(row, column) {
      const keySize = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--key-size"));
      const keyGap = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--key-gap"));
      const colStep = keySize + keyGap;
      const rowStep = colStep * 0.866;
      const centerX = keyboard.clientWidth / 2;
      const centerY = keyboard.clientHeight / 2;
      const anchor = keyboardConfig.anchor;
      const x = centerX
        + ((column - anchor.column) + (rowParity(row) - rowParity(anchor.row)) * 0.5) * colStep
        - keySize / 2;
      const y = centerY + (row - anchor.row) * rowStep - keySize / 2;

      return { x, y, keySize, colStep, rowStep };
    }

    function visibleGridBounds() {
      const keySize = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--key-size"));
      const keyGap = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--key-gap"));
      const colStep = keySize + keyGap;
      const rowStep = colStep * 0.866;
      const anchor = keyboardConfig.anchor;
      const rowReach = Math.ceil(keyboard.clientHeight / rowStep / 2) + 2;
      const columnReach = Math.ceil(keyboard.clientWidth / colStep / 2) + 3;

      return {
        rowMin: anchor.row - rowReach,
        rowMax: anchor.row + rowReach,
        columnMin: anchor.column - columnReach,
        columnMax: anchor.column + columnReach
      };
    }

    function voiceId(pointerId, midi) {
      return `${pointerId}:${midi}`;
    }

    function chordVoiceId(pointerId, pitchClass) {
      return `${pointerId}:pc:${pitchClass}`;
    }

    function pitchClassOfMidi(midi) {
      return ((midi % keyboardConfig.edo) + keyboardConfig.edo) % keyboardConfig.edo;
    }

    function colorForPitch(midi) {
      if (!keyboardConfig.microtonal) return pitchColors[pitchClassOfMidi(midi)];
      const octavePosition = ((midi / 12) % 1 + 1) % 1;
      const hue = octavePosition * 360;
      return `hsl(${hue} 78% 58%)`;
    }

    function microtonalNumberAt(row, column) {
      const anchor = keyboardConfig.anchor;
      const rowDelta = row - anchor.row;
      const doubledX = column * 2 + rowParity(row);
      const anchorDoubledX = anchor.column * 2 + rowParity(anchor.row);
      const rightDelta = (doubledX - anchorDoubledX + rowDelta) / 2;
      const uprightDelta = -rowDelta;
      const numerator = Math.round(
        rightDelta * keyboardConfig.microtonalRightNumerator
        + uprightDelta * keyboardConfig.microtonalUprightNumerator
      );
      const denominator = keyboardConfig.microtonalDenominator;
      return ((numerator % denominator) + denominator) % denominator;
    }

    function uniquePitchClassesFromChordVoices() {
      const pitchClasses = new Set();

      for (const id of activeVoices.keys()) {
        const match = id.match(/:pc:(\d+)$/);
        if (match) {
          pitchClasses.add(Number(match[1]));
        }
      }

      return [...pitchClasses].sort((a, b) => a - b);
    }

    function sameIntervals(a, b) {
      return a.length === b.length && a.every((value, index) => value === b[index]);
    }

    function recognizeChord(pitchClasses) {
      if (!pitchClasses.length) return null;

      if (pitchClasses.length === 1) {
        const root = pitchClasses[0];
        return {
          brief: pitchNames[root],
          full: `${pitchFullNames[root]} single note`,
          recognized: true
        };
      }

      const matches = [];

      for (const root of pitchClasses) {
        const intervals = pitchClasses
          .map((pitchClass) => (pitchClass - root + 12) % 12)
          .sort((a, b) => a - b);

        for (const pattern of chordPatterns) {
          if (sameIntervals(intervals, pattern.intervals)) {
            matches.push({
              brief: `${pitchNames[root]}${pattern.suffix}`,
              full: `${pitchFullNames[root]} ${pattern.full}`
            });
          }
        }
      }

      if (matches.length) {
        return {
          brief: matches.map((match) => match.brief).join("\n"),
          full: matches.map((match) => match.full).join("\n"),
          recognized: true
        };
      }

      return {
        brief: pitchClasses.map((pitchClass) => pitchNames[pitchClass]).join(" "),
        full: "unrecognized chord",
        recognized: false
      };
    }

    function scaleChordText(briefText, fullText) {
      const longestBriefLine = Math.max(1, ...briefText.split("\n").map((line) => line.length));
      const longestFullLine = Math.max(1, ...fullText.split("\n").map((line) => line.length));
      const lineCount = Math.max(1, briefText.split("\n").length);
      const briefScale = Math.min(1, Math.max(0.34, 14 / longestBriefLine, 3 / lineCount));
      const fullScale = Math.min(1, Math.max(0.46, 72 / longestFullLine));

      document.documentElement.style.setProperty("--chord-brief-scale", String(briefScale));
      document.documentElement.style.setProperty("--chord-full-scale", String(fullScale));
    }

    function updateChordDisplay() {
      if (!chordModeEnabled) {
        chordDisplay.classList.remove("is-visible");
        chordDisplay.classList.remove("is-unrecognized");
        chordBrief.textContent = "";
        chordFull.textContent = "";
        scaleChordText("", "");
        return;
      }

      const chord = recognizeChord(uniquePitchClassesFromChordVoices());

      if (!chord) {
        chordDisplay.classList.remove("is-visible");
        chordDisplay.classList.remove("is-unrecognized");
        chordBrief.textContent = "";
        chordFull.textContent = "";
        scaleChordText("", "");
        return;
      }

      chordBrief.textContent = chord.brief;
      chordFull.textContent = chord.full;
      scaleChordText(chord.brief, chord.full);
      chordDisplay.classList.add("is-visible");
      chordDisplay.classList.toggle("is-unrecognized", !chord.recognized);
    }

    function addPlayingKey(pointerId, key) {
      let keys = activePointerKeys.get(pointerId);

      if (!keys) {
        keys = new Set();
        activePointerKeys.set(pointerId, keys);
      }

      keys.add(key);
      key.classList.add("is-playing");
    }

    function clearPointerKeys(pointerId) {
      const keys = activePointerKeys.get(pointerId);
      if (!keys) return;

      for (const key of keys) {
        key.classList.remove("is-playing");
      }
      activePointerKeys.delete(pointerId);
    }

    function stopVoice(id) {
      const voice = activeVoices.get(id);
      if (!voice || !audioContext) return;

      const now = audioContext.currentTime;

      for (const { oscillator, gain } of voice.nodes) {
        gain.gain.cancelScheduledValues(now);
        gain.gain.setValueAtTime(Math.max(gain.gain.value, 0.0001), now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);
        oscillator.stop(now + 0.95);
      }
      activeVoices.delete(id);
      updateChordDisplay();
    }

    function stopPointerVoices(pointerId) {
      const prefix = `${pointerId}:`;

      for (const id of [...activeVoices.keys()]) {
        if (id.startsWith(prefix)) {
          stopVoice(id);
        }
      }
      clearPointerKeys(pointerId);
      updateChordDisplay();
    }

    function stopAllVoices() {
      for (const id of [...activeVoices.keys()]) {
        stopVoice(id);
      }
      activePointers.clear();
      for (const pointerId of [...activePointerKeys.keys()]) {
        clearPointerKeys(pointerId);
      }
      updateChordDisplay();
    }

    function startTone(midi, key, pointerId, options = {}) {
      audioContext ??= new AudioContext();
      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      const pitchClass = pitchClassOfMidi(midi);
      const id = options.chordSpread
        ? chordVoiceId(pointerId, pitchClass)
        : voiceId(pointerId, midi);
      if (!options.accumulate) {
        stopPointerVoices(pointerId);
      }
      addPlayingKey(pointerId, key);
      if (activeVoices.has(id)) {
        updateChordDisplay();
        return;
      }

      const now = audioContext.currentTime;
      const nodes = [];
      const midis = options.chordSpread
        ? audibleOctaveMidisForPitchClass(pitchClass)
        : [midi];
      const weights = midis.map(gaussianWeight);
      const totalWeight = weights.reduce((sum, weight) => sum + weight, 0) || 1;
      const peakGain = options.chordSpread ? 0.24 : 0.2;

      midis.forEach((voiceMidi, index) => {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const weightedPeak = peakGain * weights[index] / totalWeight;

        oscillator.type = "sine";
        oscillator.frequency.value = midiToFrequency(voiceMidi);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, weightedPeak), now + 0.025);
        gain.gain.setTargetAtTime(Math.max(0.0002, weightedPeak * 0.8), now + 0.025, 0.18);
        oscillator.connect(gain).connect(audioContext.destination);
        oscillator.start(now);
        nodes.push({ oscillator, gain });
      });

      activeVoices.set(id, { nodes });
      updateChordDisplay();
    }

    function keyFromPoint(clientX, clientY) {
      let nearestKey = null;
      let nearestDistance = Infinity;
      const maxDistance = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--key-size")) * 0.62;
      const keySelector = chordModeEnabled ? ".key" : ".key[data-audible='true']";

      for (const key of keyboard.querySelectorAll(keySelector)) {
        const rect = key.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const distance = Math.hypot(clientX - centerX, clientY - centerY);

        if (distance < nearestDistance) {
          nearestDistance = distance;
          nearestKey = key;
        }
      }

      return nearestDistance <= maxDistance ? nearestKey : null;
    }

    function movePointerToKey(event) {
      const key = keyFromPoint(event.clientX, event.clientY);
      const lastKey = activePointers.get(event.pointerId);

      if (key === lastKey) return;

      activePointers.set(event.pointerId, key);

      if (key) {
        startTone(Number(key.dataset.midi), key, event.pointerId, {
          accumulate: chordModeEnabled,
          chordSpread: chordModeEnabled
        });
      } else if (!chordModeEnabled) {
        stopPointerVoices(event.pointerId);
      }
    }

    function releasePointer(event) {
      stopPointerVoices(event.pointerId);
      activePointers.delete(event.pointerId);
    }

    function renderKeyboard() {
      const layerSize = Math.ceil(Math.hypot(window.innerWidth, window.innerHeight));
      document.documentElement.style.setProperty("--keyboard-layer-size", `${layerSize}px`);
      keyboard.replaceChildren();
      keyboard.setAttribute("aria-label", `${keyboardConfig.name} isomorphic keyboard`);

      const bounds = visibleGridBounds();
      for (let row = bounds.rowMin; row <= bounds.rowMax; row += 1) {
        for (let column = bounds.columnMin; column <= bounds.columnMax; column += 1) {
          const { x, y, keySize } = keyPosition(row, column);

          const midi = noteAt(row, column);
          const frequency = midiToFrequency(midi);
          const isAudible = chordModeEnabled
            || (frequency >= keyboardConfig.hearingMinHz && frequency <= keyboardConfig.hearingMaxHz);
          const pitchClass = ((midi % keyboardConfig.edo) + keyboardConfig.edo) % keyboardConfig.edo;
          const key = document.createElement("div");

          key.className = "key";
          if (keyboardConfig.microtonal && microtonalNumbersEnabled) {
            key.classList.add("microtonal-numbered");
            key.dataset.microtonalNumber = String(microtonalNumberAt(row, column));
          }
          key.classList.toggle("is-muted", !isAudible);
          key.setAttribute("role", "button");
          key.tabIndex = 0;
          const keyColor = colorForPitch(midi);
          key.style.setProperty("--key-color", keyColor);
          key.style.setProperty("--key-glow-color", keyboardConfig.microtonal ? keyColor : brightenHexColor(keyColor));
          key.style.transform = `translate(${x}px, ${y}px)`;
          key.setAttribute("aria-label", `Pitch class ${pitchClass}`);
          key.dataset.midi = String(midi);
          key.dataset.audible = String(isAudible);
          key.dataset.pitchClass = String(pitchClass);
          key.dataset.row = String(row);
          key.dataset.column = String(column);

          keyboard.append(key);
        }
      }
    }

    createModeOptions();
    microtonalSettings.classList.toggle("is-visible", keyboardConfig.microtonal === true);
    updateMicrotonalSteps();
    setChordDisplayOpacity(chordDisplayOpacity * 100);
    syncChordModeAvailability();
    renderPaletteEditor();
    initializeKeySize();
    setRotation(0);
    loadUrlState();
    renderKeyboard();
    modeSelect.addEventListener("change", () => { setMode(modeSelect.value); updateUrlState(); });
    const handleMicrotonalInput = () => {
      if (updateMicrotonalSteps()) {
        stopAllVoices();
        requestAnimationFrame(renderKeyboard);
        updateUrlState();
      }
    };
    microRightNumerator.addEventListener("change", handleMicrotonalInput);
    microUprightNumerator.addEventListener("change", handleMicrotonalInput);
    microDenominator.addEventListener("change", handleMicrotonalInput);
    microtonalNumbersToggle.addEventListener("change", () => {
      microtonalNumbersEnabled = microtonalNumbersToggle.checked;
      requestAnimationFrame(renderKeyboard);
      updateUrlState();
    });
    chordModeToggle.addEventListener("change", () => {
      chordModeEnabled = currentModeId === "harmonic" && chordModeToggle.checked;
      stopAllVoices();
      syncChordModeAvailability();
      requestAnimationFrame(renderKeyboard);
      updateUrlState();
    });
    chordOpacitySlider.addEventListener("input", () => { setChordDisplayOpacity(chordOpacitySlider.value); updateUrlState(); });
    resetPalette.addEventListener("click", () => { resetPitchColors(); updateUrlState(); });
    keySizeSlider.addEventListener("input", () => {
      setKeySize(keySizeSlider.value);
      requestAnimationFrame(renderKeyboard);
      updateUrlState();
    });
    rotationSlider.addEventListener("input", () => {
      setRotation(rotationSlider.value);
      updateUrlState();
    });
    window.addEventListener("resize", renderKeyboard);
    settingsDetails.addEventListener("toggle", () => requestAnimationFrame(renderKeyboard));
    keyboard.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      keyboard.setPointerCapture(event.pointerId);
      movePointerToKey(event);
    });
    keyboard.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });
    keyboard.addEventListener("pointermove", (event) => {
      if (!activePointers.has(event.pointerId)) return;

      event.preventDefault();
      movePointerToKey(event);
    });
    keyboard.addEventListener("pointerup", releasePointer);
    keyboard.addEventListener("pointercancel", releasePointer);
    keyboard.addEventListener("lostpointercapture", releasePointer);
    requestAnimationFrame(renderKeyboard);
  </script>
</body>
</html>
