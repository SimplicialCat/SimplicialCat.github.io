<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>求真立体图</title>
<style>
  :root {
    --accent: #e0523f;
    --panel: rgba(17, 22, 28, 0.78);
    --line: rgba(255, 255, 255, 0.09);
    --text: #e8ecf1;
    --muted: #97a2ad;
    --chip: #b7a98c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    background: #0d1116;
    color: var(--text);
    -webkit-user-select: none;
    user-select: none;
  }
  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    pointer-events: none;
    z-index: 2;
    background: transparent;
  }
  #three-scene {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: block;
    touch-action: none;
    cursor: grab;
    background:
      radial-gradient(1100px 700px at 68% 30%, #1b232d 0%, #0d1116 62%),
      #0d1116;
  }
  #three-scene.grabbing { cursor: grabbing; }
  #three-scene.hovering { cursor: pointer; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.42);
  }
  .title-panel {
    position: fixed;
    top: 8px;
    left: 8px;
    padding: 10px 12px;
    max-width: 340px;
    z-index: 10;
  }
  .title-panel h1 { font-size: 19px; font-weight: 700; letter-spacing: 0.5px; line-height: 1.3; }
  .title-panel h1 .floor { color: var(--accent); margin: 0 4px; }
  .top-actions {
    position: fixed;
    top: 18px;
    right: 18px;
    display: flex;
    gap: 8px;
    z-index: 10;
  }
  .bottom-actions {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 10;
  }
  .floor-switch {
    position: fixed;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 0;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    background: var(--panel);
    backdrop-filter: blur(14px);
  }
  .floor-btn {
    border: 0;
    border-radius: 0;
    min-width: 52px;
    text-align: center;
  }
  .floor-btn.active {
    background: rgba(224, 82, 63, 0.18);
    border-color: transparent;
  }
  .floor-btn + .floor-btn { border-left: 0; border-top: 1px solid var(--line); }
  .chip-btn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 12.5px;
    padding: 8px 13px;
    border-radius: 4px;
    cursor: pointer;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .chip-btn:hover { border-color: rgba(255, 255, 255, 0.28); }
  .chip-btn.active { border-color: rgba(224, 82, 63, 0.75); color: #ffb3a6; }
  .legend-panel {
    position: fixed;
    top: 108px;
    left: 84px;
    width: 258px;
    padding: 10px;
    z-index: 9;
    overflow: hidden auto;
    max-height: calc(100vh - 200px);
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.18) transparent;
  }
  .legend-panel.hidden { display: none; }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    appearance: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text);
    font: inherit;
    text-align: left;
    padding: 7px 9px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .legend-item:hover { background: rgba(255, 255, 255, 0.05); }
  .legend-item.active { background: rgba(224, 82, 63, 0.16); border-color: rgba(224, 82, 63, 0.5); }
  .num-chip {
    flex: 0 0 auto;
    min-width: 30px;
    height: 30px;
    padding: 0 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    background: var(--chip);
    color: #241d12;
    font-weight: 700;
    font-size: 13px;
  }
  .legend-item.active .num-chip { background: var(--accent); color: #fff; }
  .legend-name { display: flex; flex-direction: column; min-width: 0; }
  .legend-name b { font-size: 13.5px; font-weight: 600; }
  .legend-name span {
    font-size: 10.5px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .info-panel {
    position: fixed;
    right: 18px;
    bottom: 56px;
    width: 296px;
    padding: 16px 18px;
    z-index: 10;
  }
  .info-panel.hidden { display: none; }
  .info-head { display: flex; align-items: center; gap: 12px; }
  .info-head .num-chip { min-width: 38px; height: 38px; font-size: 15px; }
  .info-title { min-width: 0; }
  .info-title b { display: block; font-size: 17px; font-weight: 700; }
  .info-title span {
    display: block;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-top: 2px;
  }
  .info-desc { margin-top: 12px; font-size: 12.5px; line-height: 1.75; color: #c8d0d9; }
  .info-foot { margin-top: 14px; display: flex; gap: 8px; }
  .info-foot button {
    flex: 1;
    appearance: none;
    font: inherit;
    font-size: 12.5px;
    padding: 8px 0;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    transition: background 0.15s, border-color 0.15s;
  }
  .info-foot button.primary { background: rgba(224, 82, 63, 0.2); border-color: rgba(224, 82, 63, 0.55); color: #ffc2b8; }
  .info-foot button:hover { border-color: rgba(255, 255, 255, 0.3); }
  @media (max-width: 760px) {
    .title-panel { top: 8px; left: 8px; max-width: calc(100vw - 36px); }
    .top-actions { top: 8px; left: auto; right: 8px; justify-content: flex-end; }
    .floor-btn { min-width: 38px; }
    .legend-panel {
      top: auto;
      bottom: 58px;
      left: 8px;
      right: 8px;
      width: auto;
      max-height: 32vh;
      padding: 4px;
      z-index: 8;
    }
    #legendList {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 2px;
    }
    .legend-item {
      gap: 5px;
      padding: 3px 5px;
      line-height: 1.1;
    }
    .legend-item .num-chip {
      min-width: 20px;
      height: 20px;
      padding: 0 4px;
      font-size: 10px;
    }
    .legend-item .legend-name b { font-size: 11px; }
    .legend-item .legend-name span { display: none; }
    .legend-panel.hidden { display: block; visibility: hidden; pointer-events: none; }
    .info-panel { width: calc(100vw - 36px); bottom: 58px; }
  }
</style>
</head>

(function () {
  const sources = [
    'three.min.js',

    'https://unpkg.com/three@0.128.0/build/three.min.js'
  ];
  let sourceIndex = 0;
  function startCanvas() {
    if (window.__qzUseThree || window.__qzCanvasActive) return;
    window.__qzCanvasActive = true;
    requestAnimationFrame(tick);
  }
  function start() {
    if (window.THREE) {
      if (typeof window.__qzInitThree !== 'function') {
        setTimeout(start, 20);
        return;
      }
      window.__qzUseThree = true;
      window.__qzCanvasActive = false;
      window.__qzInitThree();
    } else {
      window.__qzUseThree = false;
      startCanvas();
    }
  }
  function loadNext() {
    if (sourceIndex >= sources.length) return start();
    const script = document.createElement('script');
    script.src = sources[sourceIndex++];
    let settled = false;
    const finishLoad = function () {
      if (settled) return;
      settled = true;
      clearTimeout(timeout);
      start();
    };
    const failLoad = function () {
      if (settled) return;
      settled = true;
      clearTimeout(timeout);
      script.remove();
      loadNext();
    };
    const timeout = setTimeout(failLoad, 3500);
    script.onload = finishLoad;
    script.onerror = failLoad;
    document.head.appendChild(script);
  }
  setTimeout(startCanvas, 0);
  loadNext();
})();
</script>

function v(x, y, z) { return { x: x, y: y, z: z }; }
function vsub(a, b) { return v(a.x - b.x, a.y - b.y, a.z - b.z); }
function vdot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }
function vcross(a, b) {
  return v(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
}
function vlen(a) { return Math.hypot(a.x, a.y, a.z); }
function vnorm(a) {
  var l = vlen(a) || 1;
  return v(a.x / l, a.y / l, a.z / l);
}

function extrudeVolume(ref, poly, base, height, roofKind, wallKind, pickable, floor) {
  var faces = [];
  var n = poly.length;
  var area2 = 0;
  for (var w = 0; w < n; w++) {
    var wp = W(poly[w][0], poly[w][1]);
    var wq = W(poly[(w + 1) % n][0], poly[(w + 1) % n][1]);
    area2 += wp.x * wq.y - wq.x * wp.y;
  }
  var ccw = area2 > 0;
  var topPts = [], cx = 0, cy = 0;
  for (var i = 0; i < n; i++) {
    var p = W(poly[i][0], poly[i][1]);
    topPts.push(v(p.x, p.y, base + height));
    cx += p.x; cy += p.y;
  }
  cx /= n; cy /= n;
  var ctr = v(cx, cy, base + height / 2);
  ref.center = v(cx, cy, base + height * 0.35);
  faces.push({ pts: topPts, n: v(0, 0, 1), kind: roofKind, pick: pickable, ref: ref, roof: roofKind !== 'corridorDeck', floor: floor });
  if (height > 0.05) {
    for (var j = 0; j < n; j++) {
      var a = W(poly[j][0], poly[j][1]);
      a.z = base;
      var c = W(poly[(j + 1) % n][0], poly[(j + 1) % n][1]);
      c.z = base;
      var quad = [a, c, v(c.x, c.y, base + height), v(a.x, a.y, base + height)];
      var nrm = vnorm(vcross(vsub(quad[1], quad[0]), vsub(quad[3], quad[0])));
      var mid = v((quad[0].x + quad[1].x) / 2, (quad[0].y + quad[1].y) / 2, base + height / 2);
      if (!ccw) {
        nrm = v(-nrm.x, -nrm.y, -nrm.z);
        quad = [quad[0], quad[3], quad[2], quad[1]];
      }
      faces.push({ pts: quad, n: nrm, kind: wallKind, pick: pickable, ref: ref, roof: false, floor: floor });
    }
  }
  return faces;
}

function extrudeBuilding(b, pickable) {
  return extrudeVolume(b, b.poly, b.base || 0, b.h, b.roofKind || 'roof', b.wallKind || 'wall', pickable);

function extrudeFloorRoom(room, floor) {
  var faces = [];
  var n = room.poly.length;
  var area2 = 0;
  for (var w = 0; w < n; w++) {
    var wp = v(room.poly[w][0] * S, room.poly[w][1] * S, 0);

    area2 += wp.x * wq.y - wq.x * wp.y;
  }
  var ccw = area2 > 0;
  var base = FLOOR_DEPTHS[floor];
  var height = room.category === 'avenue' ? 0.25 : 0.9;
  var topPts = [], cx = 0, cy = 0;
  for (var i = 0; i < n; i++) {
    var p = v(room.poly[i][0] * S, room.poly[i][1] * S, base + height);
    topPts.push(p);
    cx += p.x;
    cy += p.y;
  }
  cx /= n;
  cy /= n;
  room.floor = floor;
  room.base = base;
  room.height = height;
  room.center = v(cx, cy, base + height + 0.1);
  var ctr = v(cx, cy, base + height / 2);
  var pick = room.pick !== false;
  faces.push({ pts: topPts, n: v(0, 0, 1), kind: 'room', pick: pick, ref: room, roof: true });
  for (var j = 0; j < n; j++) {
    var a = v(room.poly[j][0] * S, room.poly[j][1] * S, base);
    var c = v(room.poly[(j + 1) % n][0] * S, room.poly[(j + 1) % n][1] * S, base);
    var quad = [a, c, v(c.x, c.y, base + height), v(a.x, a.y, base + height)];
    var nrm = vnorm(vcross(vsub(quad[1], quad[0]), vsub(quad[3], quad[0])));
    var mid = v((quad[0].x + quad[1].x) / 2, (quad[0].y + quad[1].y) / 2, base + height / 2);
    if (!ccw) {

    }
    faces.push({ pts: quad, n: nrm, kind: 'roomWall', pick: pick, ref: room, roof: false });
  }
  return faces;
}

function roundedRectPoly(x0, y0, x1, y1, r) {
  var pts = [];
  var corners = [
    [x1 - r, y1 - r, 0], [x0 + r, y1 - r, Math.PI / 2],
    [x0 + r, y0 + r, Math.PI], [x1 - r, y0 + r, Math.PI * 1.5]
  ];
  for (var k = 0; k < corners.length; k++) {
    for (var s = 0; s <= 6; s++) {
      var t = corners[k][2] + (Math.PI / 2) * (s / 6);
      pts.push([corners[k][0] + r * Math.cos(t), corners[k][1] + r * Math.sin(t)]);
    }
  }
  return pts;
}

function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

    return Object.prototype.hasOwnProperty.call(anim.to, k);

var eyePos, fwdDir, rightDir, upDir, focal;
function updateBasis() {
  var cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);

    cam.ty + cam.dist * cp * Math.cos(cam.yaw),
    cam.tz + cam.dist * sp
  );
  fwdDir = vnorm(vsub(v(cam.tx, cam.ty, cam.tz), eyePos));
  rightDir = vnorm(vcross(v(0, 0, 1), fwdDir));
  upDir = vcross(fwdDir, rightDir);
}
function project(p) {
  var rel = vsub(p, eyePos);
  var cz = vdot(rel, fwdDir);
  if (cz < NEAR) return null;
  return {
    x: cw / 2 + focal * vdot(rel, rightDir) / cz,
    y: ch / 2 - focal * vdot(rel, upDir) / cz,

}

var WALL = [213, 220, 228], ROOF = [238, 243, 248];
var GWALL = [178, 186, 196], GROOF = [206, 213, 222];
var SECOND_WALL = [188, 205, 218], SECOND_ROOF = [226, 239, 248];
var CORRIDOR_EDGE = [190, 182, 166], CORRIDOR_DECK = [232, 228, 217];
var GROUND = [231, 235, 240], GROUND_SIDE = [206, 213, 221], PATHC = [219, 225, 232];
var SEL_TINT = [226, 74, 57];
var showLabels = true;
var activeFloor = '1F';
var hoverRef = null;
var selection = null;
var pickFaces = [];
var ROOM_COLORS = {
  gray: [177, 184, 192],
  study: [205, 91, 76],
  zone: [225, 169, 87],
  dorm: [228, 205, 109],
  dining: [78, 176, 165],
  service: [186, 75, 63],
  event: [230, 146, 90],
  studio: [148, 174, 203],
  avenue: [196, 52, 46]
};

function isSelFace(f) {
  return !!(f.pick && f.ref && selection && selection.type === 'building' &&
            selection.ids.indexOf(f.ref.id) >= 0);
}
function faceFloor(f) {
  return f.floor || (f.ref && f.ref.floor) || '1F';
}
function faceAlpha(f) {
  return faceFloor(f) === activeFloor ? 1 : 0.10;
}
function faceColor(f) {
  var base;
  if (f.kind === 'room') base = (f.ref && f.ref.color) || (f.ref && ROOM_COLORS[f.ref.category]) || ROOF;
  else if (f.kind === 'roomWall') base = (f.ref && f.ref.color) || (f.ref && ROOM_COLORS[f.ref.category]) || WALL;
  else if (f.kind === 'floorPlate') base = f.floor === 'G' ? [137, 124, 217] : [204, 113, 116];
  else if (f.kind === 'floorSide') base = f.floor === 'G' ? [96, 87, 154] : [145, 79, 82];
  else if (f.kind === 'secondRoof') base = SECOND_ROOF;
  else if (f.kind === 'secondWall') base = SECOND_WALL;
  else if (f.kind === 'corridorDeck') base = CORRIDOR_DECK;
  else if (f.kind === 'corridorEdge') base = CORRIDOR_EDGE;
  else base = f.kind === 'roof' ? (f.pick ? ROOF : GROOF) : (f.pick ? WALL : GWALL);
  var bright = 0.58 + 0.42 * Math.max(0, vdot(f.n, LIGHT));
  if (f.roof) bright = Math.min(1.04, bright + 0.1);
  if (f.kind === 'roomWall') bright *= 0.72;
  var sel = isSelFace(f);
  if (f.pick && f.ref && hoverRef && hoverRef.id === f.ref.id && !sel) bright *= 1.06;
  var r = base[0], g = base[1], b = base[2];
  if (sel) { r = r * 0.55 + SEL_TINT[0] * 0.45; g = g * 0.55 + SEL_TINT[1] * 0.45; b = b * 0.55 + SEL_TINT[2] * 0.45; }
  var alpha = faceAlpha(f);
  return 'rgba(' + Math.round(clamp(r * bright, 0, 255)) + ',' +
                  Math.round(clamp(g * bright, 0, 255)) + ',' +
                  Math.round(clamp(b * bright, 0, 255)) + ',' + alpha + ')';
}

function drawFace(f, scr) {
  ctx.beginPath();
  ctx.moveTo(scr[0].x, scr[0].y);
  for (var i = 1; i < scr.length; i++) ctx.lineTo(scr[i].x, scr[i].y);
  ctx.closePath();
  ctx.fillStyle = faceColor(f);
  ctx.fill();
  var sel = isSelFace(f);
  var alpha = faceAlpha(f);
  ctx.lineWidth = f.roof ? 1 : 0.75;
  ctx.strokeStyle = sel ? 'rgba(226, 74, 57, ' + (alpha * 0.9) + ')' :
    'rgba(72, 84, 96, ' + (0.06 + alpha * 0.16) + ')';
  ctx.stroke();
}

function polyContains(pts, x, y) {
  var inside = false;
  for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    var xi = pts[i].x, yi = pts[i].y, xj = pts[j].x, yj = pts[j].y;
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

function projectFaceList(list) {
  var out = [];
  for (var i = 0; i < list.length; i++) {
    var f = list[i];
    if (!isFrontFace(f)) continue;
    var scr = [], ok = true, dsum = 0;
    for (var k = 0; k < f.pts.length; k++) {
      var p = project(f.pts[k]);
      if (!p) { ok = false; break; }
      scr.push(p); dsum += p.d;
    }
    if (ok) out.push({ f: f, scr: scr, depth: dsum / f.pts.length });
  }
  return out;
}

function isFrontFace(f) {
  var cx = 0, cy = 0, cz = 0;
  for (var i = 0; i < f.pts.length; i++) {
    cx += f.pts[i].x; cy += f.pts[i].y; cz += f.pts[i].z;
  }
  var center = v(cx / f.pts.length, cy / f.pts.length, cz / f.pts.length);
  return vdot(f.n, vsub(eyePos, center)) > 0;
}

function projectAll() {
  return projectFaceList(FACES);
}

function drawShadowPolys() {
  var off = vnorm(v(-LIGHT.x, -LIGHT.y, 0));
  ctx.fillStyle = 'rgba(24, 34, 45, 0.16)';
  for (var i = 0; i < shadowPolys.length; i++) {
    var sp = shadowPolys[i];
    var dx = off.x * sp.h * S * 0.32, dy = off.y * sp.h * S * 0.32;
    var scr = [], ok = true;
    for (var k = 0; k < sp.poly.length; k++) {
      var p = project(v(sp.poly[k][0] * S + dx, sp.poly[k][1] * S + dy, 0.09));
      if (!p) { ok = false; break; }
      scr.push(p);
    }
    if (!ok) continue;
    ctx.beginPath();
    ctx.moveTo(scr[0].x, scr[0].y);
    for (var m = 1; m < scr.length; m++) ctx.lineTo(scr[m].x, scr[m].y);
    ctx.closePath();
    ctx.fill();
  }
}

function displayName(value) {
  var text = String(value || '').replace(/（[^）]*）/g, '').replace(/\([^)]*\)/g, '').trim();
  return text || value;
}

function drawLabels() {
  if (!showLabels) return;
  if (activeFloor === '2F') {
    drawSecondFloorLabels();
    return;
  }
  if (activeFloor !== '1F') {
    drawRoomLabels();
    return;
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var i = 0; i < BUILDINGS.length; i++) {
    var b = BUILDINGS[i];
    if (b.secondOnly) continue;
    var p = project(v(b.center.x, b.center.y, (b.top || b.h) + 0.6));
    if (!p) continue;
    var sel = selection && selection.type === 'building' && selection.ids.indexOf(b.id) >= 0;
    var text = displayName(b.zh);
    var size = text.length > 4 ? 10 : text.length > 2 ? 11 : 13;
    ctx.font = '600 ' + size + 'px "Segoe UI", "Microsoft YaHei", system-ui, sans-serif';
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.strokeText(text, p.x, p.y);
    ctx.fillStyle = sel ? '#d8432f' : 'rgba(84, 96, 108, 0.92)';
    ctx.fillText(text, p.x, p.y);
  }
}

function drawSecondFloorLabels() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  function polygonArea(poly) {
    var area2 = 0;
    for (var i = 0; i < poly.length; i++) {
      var a = poly[i], b = poly[(i + 1) % poly.length];
      area2 += a[0] * b[1] - b[0] * a[1];
    }
    return area2;
  }
  function polygonCentroid(poly) {
    var area2 = 0, cx = 0, cy = 0;
    for (var i = 0; i < poly.length; i++) {
      var a = poly[i], b = poly[(i + 1) % poly.length];
      var cross = a[0] * b[1] - b[0] * a[1];
      area2 += cross;
      cx += (a[0] + b[0]) * cross;
      cy += (a[1] + b[1]) * cross;
    }
    area2 /= 2;
    return [cx / (6 * area2), cy / (6 * area2)];
  }
  BUILDINGS.forEach(function (b) {
    var polys = b.secondPolys || [b.poly];
    var labelPoly = polys.reduce(function (best, poly) {
      return Math.abs(polygonArea(poly)) > Math.abs(polygonArea(best)) ? poly : best;
    });
    var center = polygonCentroid(labelPoly);
    var p = project(v(center[0] * S, center[1] * S, (b.top || b.h) + 0.6));
    if (!p) return;
    var sel = selection && selection.type === 'building' && selection.ids.indexOf(b.id) >= 0;
    var text = displayName(b.zh);
    var size = text.length > 4 ? 10 : text.length > 2 ? 11 : 13;
    ctx.font = '600 ' + size + 'px "Segoe UI", "Microsoft YaHei", system-ui, sans-serif';
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.strokeText(text, p.x, p.y);
    ctx.fillStyle = sel ? '#d8432f' : 'rgba(84, 96, 108, 0.92)';
    ctx.fillText(text, p.x, p.y);
  });
}

function drawStairs(now) {
  ctx.font = '700 10px "Segoe UI", system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var i = 0; i < STAIRS.length; i++) {
    var st = STAIRS[i];
    var p = project(W(st.pos[0], st.pos[1]));
    if (!p) continue;
    var sel = selection && selection.type === 'stair' && selection.stair.id === st.id;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 8.5, 0, Math.PI * 2);
    ctx.fillStyle = sel ? '#ff6a52' : '#c0392b';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.fillText(st.id, p.x, p.y + 0.5);
  }
}

function drawRoomLabels() {
  if (!showLabels) return;
  var rooms = FLOOR_ROOMS[activeFloor];
  if (!rooms) return;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var i = 0; i < rooms.length; i++) {
    var room = rooms[i];
    if (room.category === 'avenue' && room.id !== 'LGAV') continue;
    if (room.num === '—') continue;
    var p = project(room.center);
    if (!p) continue;
    var text = displayName(room.zh);
    var size = text.length > 4 ? 9 : text.length > 2 ? 10 : 12;
    ctx.font = '700 ' + size + 'px "Segoe UI", "Microsoft YaHei", system-ui, sans-serif';
    var selected = !!(selection && selection.ids && selection.ids.indexOf(room.id) >= 0);
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(18,24,32,0.68)';
    ctx.strokeText(text, p.x, p.y);
    ctx.fillStyle = selected ? '#fff' : 'rgba(255,255,255,0.9)';
    ctx.fillText(text, p.x, p.y);
  }
}

function drawFloorMarkers(now) {
  if (activeFloor === 'LG') {
    ctx.font = '700 8px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < LG_EXITS.length; i++) {
      var pos = LG_EXITS[i];
      var p = project(v(pos[0] * S, pos[1] * S, FLOOR_DEPTHS.LG + 0.5));
      if (!p) continue;
      ctx.fillStyle = '#1c7c46';
      ctx.fillRect(p.x - 13, p.y - 6, 26, 12);
      ctx.fillStyle = '#fff';
      ctx.fillText('EXIT', p.x, p.y + 0.5);
    }
  }
}

function drawCompass() {
  var p0 = project(v(cam.tx, cam.ty, cam.tz));
  var p1 = project(v(cam.tx, cam.ty + 6, cam.tz));
  if (!p0 || !p1) return;
  var dx = p1.x - p0.x, dy = p1.y - p0.y;
  var l = Math.hypot(dx, dy);
  if (l < 1e-4) return;
  dx /= l; dy /= l;
  var cx = cw - 46, cy = ch - 92, r = 17;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(238, 242, 246, 0.88)';
  ctx.fill();
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(90, 100, 112, 0.4)';
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - dx * 11, cy - dy * 11);
  ctx.lineTo(cx + dx * 12, cy + dy * 12);
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#d8432f';
  ctx.stroke();
  ctx.font = '700 10px "Segoe UI", system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#3a444e';
  ctx.fillText('N', cx + dx * (r + 8), cy + dy * (r + 8));
}

function render(now) {
  ctx.clearRect(0, 0, cw, ch);
  focal = (ch / 2) / Math.tan(FOV / 2);
  updateBasis();
  var gf = [];
  for (var i = 0; i < groundFaces.length; i++) {
    var f = groundFaces[i];
    if (!isFrontFace(f)) continue;
    var scr = [], ok = true, dsum = 0;
    for (var k = 0; k < f.pts.length; k++) {
      var p = project(f.pts[k]);
      if (!p) { ok = false; break; }
      scr.push(p); dsum += p.d;
    }
    if (ok) gf.push({ f: f, scr: scr, sub: f.sub, depth: dsum / f.pts.length });
  }
  gf.sort(function (a, b) { return a.sub - b.sub || b.depth - a.depth; });
  for (var j = 0; j < gf.length; j++) {
    var g = gf[j];
    ctx.beginPath();
    ctx.moveTo(g.scr[0].x, g.scr[0].y);
    for (var m = 1; m < g.scr.length; m++) ctx.lineTo(g.scr[m].x, g.scr[m].y);
    ctx.closePath();
    var bright = 0.9 + 0.1 * Math.max(0, vdot(g.f.n, LIGHT));
    var base = g.f.kind === 'ground' ? (g.f.sub === 0 ? GROUND_SIDE : GROUND) : PATHC;
    var alpha = faceAlpha(g.f);
    ctx.fillStyle = 'rgba(' + Math.round(base[0] * bright) + ',' + Math.round(base[1] * bright) + ',' + Math.round(base[2] * bright) + ',' + alpha + ')';
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(72, 84, 96, ' + (0.03 + alpha * 0.09) + ')';
    ctx.stroke();
  }
  if (activeFloor === '1F') drawShadowPolys();
  var all = projectAll();
  for (var gi = 0; gi < grayFaces.length; gi++) {
    var f2 = grayFaces[gi];
    if (!isFrontFace(f2)) continue;
    var scr2 = [], ok2 = true, dsum2 = 0;
    for (var k2 = 0; k2 < f2.pts.length; k2++) {
      var p2 = project(f2.pts[k2]);
      if (!p2) { ok2 = false; break; }
      scr2.push(p2);
      dsum2 += p2.d;
    }
    if (ok2) all.push({ f: f2, scr: scr2, depth: dsum2 / f2.pts.length });
  }
  ['LG', 'G'].forEach(function (floor) {
    all = all.concat(projectFaceList(FLOOR_FACES[floor]));
  });
  all.sort(function (a, b) { return b.depth - a.depth; });
  pickFaces = [];
  for (var q = 0; q < all.length; q++) {
    drawFace(all[q].f, all[q].scr);
    if (all[q].f.pick) pickFaces.push(all[q]);
  }
  if (activeFloor === '1F') drawStairs(now);
  else drawFloorMarkers(now);
  drawLabels();
  drawCompass();
}

var lastT = 0;
function tick(now) {
  if (!window.__qzCanvasActive) return;
  lastT = now;
  stepAnim(now);
  render(now);
  requestAnimationFrame(tick);
}
/* ================= 拾取 ================= */
function pickBuilding(x, y) {
  for (var i = pickFaces.length - 1; i >= 0; i--) {
    if (polyContains(pickFaces[i].scr, x, y)) return pickFaces[i].f.ref;
  }
  return null;
}
function pickStair(x, y) {
  if (activeFloor !== '1F') return null;
  for (var i = 0; i < STAIRS.length; i++) {
    var st = STAIRS[i];
    var p = project(W(st.pos[0], st.pos[1]));
    if (p && Math.hypot(p.x - x, p.y - y) < 13) return st;
  }
  return null;
}

/* ================= 交互 ================= */
var pointers = new Map();
var pinchStart = null;

canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

canvas.addEventListener('pointerdown', function (e) {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {
    x: e.clientX, y: e.clientY, moved: 0, button: e.button
  });
  lastInteract = performance.now();
  if (pointers.size === 2) {
    var pts = Array.from(pointers.values());
    pinchStart = {
      dist: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y),
      d0: cam.dist
    };
  }
  dragging = true;
  anim = null;
  canvas.classList.add('grabbing');
});

canvas.addEventListener('pointermove', function (e) {
  lastInteract = performance.now();
  var pt = pointers.get(e.pointerId);
  if (!pt) {
    var hb = pickBuilding(e.clientX, e.clientY);
    var hs = hb ? null : pickStair(e.clientX, e.clientY);
    hoverRef = hb;
    canvas.classList.toggle('hovering', !!(hb || hs));
    return;
  }
  var dx = e.clientX - pt.x, dy = e.clientY - pt.y;
  pt.moved += Math.abs(dx) + Math.abs(dy);
  pt.x = e.clientX; pt.y = e.clientY;
  if (pointers.size === 2 && pinchStart) {
    var arr = Array.from(pointers.values());
    var d = Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y);
    cam.dist = clamp(pinchStart.d0 * pinchStart.dist / Math.max(20, d), 8, 700);
    return;
  }
  if (pt.button === 2 || e.ctrlKey) {
    var k = 2 * cam.dist * Math.tan(FOV / 2) / ch;
    cam.tx = clamp(cam.tx - rightDir.x * dx * k + upDir.x * dy * k, -30, 140);
    cam.ty = clamp(cam.ty - rightDir.y * dx * k + upDir.y * dy * k, -30, 215);
  } else {
    cam.yaw -= dx * 0.006;
    cam.pitch = clamp(cam.pitch + dy * 0.006, 0.14, 1.5);
  }
});

function endPointer(e) {
  var pt = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStart = null;
  if (pointers.size === 0) {
    dragging = false;
    canvas.classList.remove('grabbing');
    lastInteract = performance.now();
    if (pt && pt.moved < 8) {
      var b = pickBuilding(e.clientX, e.clientY);
      if (b) { selectBuilding(b.group || b.id); }
      else {
        var st = pickStair(e.clientX, e.clientY);
        if (st) selectStair(st);
        else clearSelection();
      }
    }
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

canvas.addEventListener('wheel', function (e) {
  e.preventDefault();
  lastInteract = performance.now();
  anim = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 8, 700);
}, { passive: false });

/* ================= 选择与信息面板 ================= */
var infoEl = document.getElementById('info');
var infoChip = document.getElementById('infoChip');
var infoZh = document.getElementById('infoZh');
var infoEn = document.getElementById('infoEn');
var infoDesc = document.getElementById('infoDesc');
var legendEl = document.getElementById('legend');

function findBuilding(id) {
  for (var i = 0; i < BUILDINGS.length; i++) if (BUILDINGS[i].id === id) return BUILDINGS[i];
  return null;
}
function findSelectable(id) {
  return findBuilding(id) || FLOOR_ROOMS.G.filter(function (room) { return room.id === id; })[0] ||
         FLOOR_ROOMS.LG.filter(function (room) { return room.id === id; })[0] ||
         CORRIDORS.filter(function (corridor) { return corridor.id === id; })[0] || null;
}
function findLegendGroup(key) {
  var lists = [LEGEND, G_LEGEND, LG_LEGEND];
  for (var li = 0; li < lists.length; li++) {
    for (var i = 0; i < lists[li].length; i++) {
      if (lists[li][i].key === key) return lists[li][i];
    }
  }
  return null;
}

function selectBuilding(key) {
  var g = findLegendGroup(key);
  if (!g) return;
  selection = { type: 'building', ids: g.ids.slice(), group: g };
  infoChip.textContent = g.num;
  infoZh.textContent = g.zh;
  infoEn.textContent = g.en;
  var b = findSelectable(g.ids[0]);
  infoDesc.textContent = b ? b.desc : '';
  infoEl.classList.remove('hidden');
  updateLegendActive();
}

function selectStair(st) {
  selection = { type: 'stair', stair: st };
  infoChip.textContent = st.id;
  infoZh.textContent = '楼梯 ' + st.id;
  infoEn.textContent = 'Staircase';
  infoDesc.textContent = st.desc;
  infoEl.classList.remove('hidden');
  updateLegendActive();
}

function clearSelection() {
  selection = null;
  infoEl.classList.add('hidden');
  updateLegendActive();
}

function updateLegendActive() {
  var items = document.querySelectorAll('.legend-item');
  for (var i = 0; i < items.length; i++) {
    var active = !!(selection && selection.type === 'building' &&
                    selection.group.key === items[i].getAttribute('data-key'));
    items[i].classList.toggle('active', active);
  }
}

function focusSelection() {
  if (!selection) return;
  if (selection.type === 'building') {
    var bs = selection.ids.map(findSelectable).filter(Boolean);
    var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9, hMax = 0;
    bs.forEach(function (b) {
      b.poly.forEach(function (p) {
        minX = Math.min(minX, p[0] * S); maxX = Math.max(maxX, p[0] * S);
        minY = Math.min(minY, p[1] * S); maxY = Math.max(maxY, p[1] * S);
      });
      hMax = Math.max(hMax, b.top || b.h || b.height || 0);
    });
    var w = maxX - minX, d = maxY - minY;
    var depth = bs.length ? (FLOOR_DEPTHS[bs[0].floor] || 0) : 0;
    flyTo({
      yaw: cam.yaw, pitch: 0.62,
      dist: clamp(Math.max(w, d) * 2.6 + hMax * 1.4 + 6, 8, 700),
      tx: (minX + maxX) / 2, ty: (minY + maxY) / 2, tz: depth + hMax * 0.3
    }, 750);
  } else {
    var st = selection.stair;
    flyTo({ yaw: cam.yaw, pitch: 0.5, dist: 30, tx: st.pos[0] * S, ty: st.pos[1] * S, tz: 0 }, 650);
  }
}

document.getElementById('btnFocus').addEventListener('click', focusSelection);
document.getElementById('btnClose').addEventListener('click', clearSelection);

/* ================= 图例 ================= */

    drawCompass();
    requestAnimationFrame(tickThree);
  }
  window.addEventListener('resize', function () { resizeThree(); });
  resizeThree();
  updateMaterials();
  requestAnimationFrame(tickThree);
};
</script>
